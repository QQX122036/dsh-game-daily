# dsh-game-daily —— bundle 自带的挂载声明
# 装好之后，profile 的 `dsh.profile.bundles` 里列出 `dsh-game-daily` 即生效。
#
#   dsh plugin --profile web add link:<本仓库目录>                          # 本地开发
#   plugin_manager  install_bundle target=<包绝对路径>                        # 交付安装
#
# 本插件不使用 schemastery Config；开发/联调隔离靠环境变量
# （DSH_GAME_DAILY_DEV / DSH_GAME_DAILY_STATE_DIR / DSH_GAME_DAILY_TASK_PREFIX），
# 这样即使宿主拿不到 schemastery 也能正常加载（参考 dsh-bili-scroll 的降级教训）。

- insert:
    - id: game-daily
      name: dsh-game-daily
      config: {}
